<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - CampusPlan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
  <style>
    .galleryWrapper { position: relative; display: flex; align-items: center; margin-top: 30px; }
    .galleryScroll { display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; padding: 10px; }
    .galleryScroll img { min-width: 220px; height: 160px; object-fit: cover; border-radius: 10px; }
    .scrollBtn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; font-size: 24px; padding: 10px 15px; border-radius: 50%; z-index: 10; cursor: pointer; }
    .scrollBtn.left { left: 0; } .scrollBtn.right { right: 0; }
    .pdfEmbed { margin-top: 40px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
  </style>
</head>
<body>
  <div id="navRoot" data-page="about" data-cart="true"></div>

  <section class="container my-5 text-center">
    <div class="glassCard">
      <h1 class="mb-3 text-primary">About CampusPlan</h1>
      <p class="text-muted mb-4">CampusPlan helps students organize campus events, collaborate with teams, and manage tasks in one place.</p>

      <div class="galleryWrapper">
        <button class="scrollBtn left" onclick="scrollGallery(-1)">&#10094;</button>
        <div class="galleryScroll" id="galleryScroll">
          <img src="" alt=""><img src="" alt=""><img src="" alt=""><img src="" alt="">
          <img src="" alt=""><img src="" alt=""><img src="" alt=""><img src="" alt="">
        </div>
        <button class="scrollBtn right" onclick="scrollGallery(1)">&#10095;</button>
      </div>

      <div class="pdfEmbed mt-4">
        <embed src="" type="application/pdf" width="100%" height="600px">
        <p class="m-3 small text-muted">
          <a href="" id="pdfLink" target="_blank">Open Campus-Plan.pdf</a> —
          Developed by PUP Sto. Tomas students. Copyright © 2026 CampusPlan.
        </p>
      </div>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const galleryFiles = ["booth.jpg","design.jpg","games.jpg","making.jpg","making02.jpg","prizes.jpg","prizes02.jpg","program.jpg"];
    document.addEventListener("DOMContentLoaded", () => {
      applyPageBackground("NavPIC.jpg");
      document.querySelectorAll("#galleryScroll img").forEach((img, i) => { img.src = imgPath(galleryFiles[i]); });
      document.querySelector(".pdfEmbed embed").src = imgPath("Campus-Plan.pdf");
      document.getElementById("pdfLink").href = imgPath("Campus-Plan.pdf");
    });
    function scrollGallery(dir) {
      document.getElementById("galleryScroll").scrollBy({ left: dir * 300, behavior: "smooth" });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
