<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCampus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>
<body>
  <div id="navRoot" data-page="home" data-cart="true"></div>

  <section class="hero text-white text-center">
    <div class="container heroContent">
      <h1 class="fw-bold display-4 mb-3">Plan Campus Events Smarter</h1>
      <p class="lead mb-4">Organize events, tasks, and announcements in one place</p>
      <button class="btn btn-light btn-lg" onclick="scrollToForm()">Create Event</button>
    </div>
  </section>

  <section class="pageSection" id="formSection">
    <div class="container">
      <h2 class="text-center text-white mb-4">Create Event</h2>
      <div class="row g-4">
        <div class="col-lg-6">
          <form id="eventForm" class="glassCard">
            <div class="marketCardSection">
              <div class="sectionTitle"><i class="fas fa-user"></i> Organizer</div>
              <input type="text" id="firstName" class="form-control formControlRound mb-2" placeholder="First Name" required>
              <input type="text" id="middleName" class="form-control formControlRound mb-2" placeholder="Middle Name (optional)">
              <input type="text" id="lastName" class="form-control formControlRound mb-2" placeholder="Last Name" required>
              <input type="tel" id="eventPhone" class="form-control formControlRound mb-2" placeholder="Mobile number" required>
              <input type="date" id="date" class="form-control formControlRound" required>
            </div>
            <div class="marketCardSection">
              <div class="sectionTitle"><i class="fas fa-location-dot"></i> Venue</div>
              <select id="eventCampus" class="form-select formControlRound mb-2" required>
                <option value="">Select campus</option>
                <option>PUP Sta. Mesa</option>
                <option>PUP Taguig</option>
                <option>PUP Quezon City</option>
                <option>PUP San Juan</option>
                <option>PUP Parañaque</option>
                <option>PUP Bataan</option>
                <option>PUP Bulacan</option>
                <option>PUP Nueva Ecija</option>
                <option>PUP Cavite</option>
                <option>PUP Laguna</option>
                <option>PUP Sto. Tomas</option>
                <option>PUP Talisay</option>
                <option>PUP Lopez</option>
                <option>PUP Mindoro</option>
                <option>PUP Ragay</option>
                <option>PUP Maragondon</option>
              </select>
              <textarea id="eventAddressLine" class="form-control formControlRound mb-2" rows="2" placeholder="Street, building, room" required></textarea>
              <div class="row g-2">
                <div class="col-md-6"><input type="text" id="eventCity" class="form-control formControlRound" placeholder="City" required></div>
                <div class="col-md-6"><input type="text" id="eventProvince" class="form-control formControlRound" placeholder="Province" required></div>
              </div>
              <input type="text" id="eventPostal" class="form-control formControlRound mt-2" placeholder="Postal code (optional)">
            </div>
            <div class="marketCardSection">
              <div class="sectionTitle"><i class="fas fa-calendar-check"></i> Event details</div>
              <select id="type" class="form-select formControlRound mb-2" required>
                <option value="">Type of Event</option>
                <option>Campus Event</option>
                <option>Organizational Event</option>
                <option>Outreach</option>
                <option>Departmental Event</option>
              </select>
              <input type="email" id="email" class="form-control formControlRound" placeholder="Email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold formControlRound">Create Event</button>
          </form>
        </div>
        <div class="col-lg-6">
          <div class="glassCard h-100">
            <h2 class="h5 mb-3">Upcoming Events</h2>
            <ul id="eventList" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    let events = [];
    let editId = null;

    function scrollToForm() {
      document.getElementById("formSection").scrollIntoView({ behavior: "smooth" });
    }

    async function loadEvents() {
      try {
        events = await apiGet("/api/events");
        renderEvents();
      } catch (e) {
        document.getElementById("eventList").innerHTML =
          `<li class="list-group-item text-danger">Could not load events. Start the Python server.</li>`;
      }
    }

    function renderEvents() {
      const list = document.getElementById("eventList");
      if (events.length === 0) {
        list.innerHTML = "<li class='list-group-item'>No events yet</li>";
        return;
      }
      list.innerHTML = events.map(e => `
        <li class="list-group-item">
          <div class="d-flex justify-content-between align-items-start gap-2">
            <div>
              <strong>${e.event_type}</strong><br>
              <small class="text-muted">${e.event_date}</small><br>
              <small class="text-muted">${e.campus || ""}${e.address_line ? " · " + e.address_line : ""}</small>
            </div>
            <div class="flex-shrink-0">
              <button class="btn btn-sm btn-warning" onclick="editEvent(${e.id})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="removeEvent(${e.id})">Delete</button>
            </div>
          </div>
        </li>`).join("");
    }

    document.getElementById("eventForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const payload = {
        organizerName: `${firstName.value} ${middleName.value} ${lastName.value}`.trim(),
        eventDate: date.value,
        campus: eventCampus.value,
        phone: eventPhone.value.trim(),
        addressLine: eventAddressLine.value.trim(),
        city: eventCity.value.trim(),
        province: eventProvince.value.trim(),
        postal: eventPostal.value.trim(),
        eventType: type.value,
        email: email.value
      };
      try {
        if (editId) {
          await apiPut(`/api/events/${editId}`, payload);
          showToast("Event updated");
        } else {
          await apiPost("/api/events", payload);
          showToast("Event created");
        }
        editId = null;
        eventForm.reset();
        await loadEvents();
      } catch (e) {
        alert(e.message);
      }
    });

    function editEvent(id) {
      const e = events.find(x => x.id === id);
      if (!e) return;
      const names = e.organizer_name.split(" ");
      firstName.value = names[0] || "";
      lastName.value = names.length > 1 ? names[names.length - 1] : "";
      middleName.value = names.length > 2 ? names.slice(1, -1).join(" ") : "";
      date.value = e.event_date;
      eventCampus.value = e.campus || "";
      eventPhone.value = e.phone || "";
      eventAddressLine.value = e.address_line || "";
      eventCity.value = e.city || "";
      eventProvince.value = e.province || "";
      eventPostal.value = e.postal || "";
      type.value = e.event_type;
      email.value = e.email;
      editId = id;
      scrollToForm();
    }

    async function removeEvent(id) {
      if (!confirm("Delete this event?")) return;
      await apiDelete(`/api/events/${id}`);
      showToast("Event deleted");
      await loadEvents();
    }

    applyPageBackground("PUPSTC.jpg");
    loadEvents();
    window.addEventListener("storage", updateCartDropdown);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
