<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>
<body>
  <div id="navRoot" data-page="login" data-user="false"></div>

  <div class="authPageWrap">
    <div class="authCard">
      <div class="text-center mb-4">
        <h1 class="fw-bold text-primary"><i class="fas fa-store"></i> CampusShop</h1>
        <p class="text-muted mb-0">Sign in or create an account</p>
      </div>

      <div class="authTabs">
        <button class="authTabBtn active" data-tab="login" onclick="showAuthTab('login')">Sign In</button>
        <button class="authTabBtn" data-tab="signup" onclick="showAuthTab('signup')">Sign Up</button>
      </div>

      <div id="loginFormWrap">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control loginInput" id="loginEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control loginInput" id="loginPassword" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
        </form>
      </div>

      <div id="signupFormWrap" style="display:none;">
        <form id="signupForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control loginInput" id="signupName" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control loginInput" id="signupEmail" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control loginInput" id="signupPassword" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Confirm Password</label>
            <input type="password" class="form-control loginInput" id="signupConfirmPassword" required>
          </div>
          <button type="submit" class="btn btn-success w-100 py-2">Create Account</button>
        </form>
      </div>

      <div class="alert alert-warning mt-4 mb-0 small">
        Demo: <code>demo@campusshop.com</code> / <code>123456</code>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    applyPageBackground("PUPSTC.jpg");
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
