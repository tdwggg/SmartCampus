<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Control - CampusShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body class="adminPage">
  <div id="navRoot" data-page="stocks" data-admin="true" data-user="false"></div>

  <div class="container pb-5">
    <div id="offlineAlert" class="alert alert-danger d-none mt-3">
      Start the Python server: <code>python app.py</code> in <code>pythonDB</code>, then open
      <a href="http://localhost:5000/stocks.html">http://localhost:5000/stocks.html</a>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
      <h4 class="mb-0"><i class="fas fa-database me-2"></i>Database Panel</h4>
      <span id="serverStatus" class="badge bg-secondary">
        <span class="statusDot statusOffline me-1"></span> Checking...
      </span>
    </div>

    <div class="cardPanel">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0"><i class="fas fa-shirt me-2"></i>Product Inventory</h5>
        <button class="btn btn-primary btn-sm" onclick="loadProducts()"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr><th>Product</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
          </thead>
          <tbody id="productsTable"></tbody>
        </table>
      </div>
    </div>

    <div class="cardPanel">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0"><i class="fas fa-receipt me-2"></i>Customer Orders</h5>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadOrders()"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>
      <div id="ordersList"><p class="text-muted mb-0">Loading...</p></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    let products = [];

    function stockLabel(p) {
      if (p.stock === 0) return '<span class="stockOut">SOLD OUT</span>';
      if (p.stock >= 999) return '<span class="preOrder">PRE-ORDER</span>';
      const cls = p.stock <= 5 ? "stockLow" : "stockOk";
      return `<span class="${cls}">${p.stock}</span>`;
    }

    async function checkServer() {
      const el = document.getElementById("serverStatus");
      const alertEl = document.getElementById("offlineAlert");
      try {
        await apiGet("/api/health");
        el.innerHTML = '<span class="statusDot statusOnline me-1"></span> Online';
        el.className = "badge bg-success";
        alertEl.classList.add("d-none");
        return true;
      } catch {
        el.innerHTML = '<span class="statusDot statusOffline me-1"></span> Offline';
        el.className = "badge bg-danger";
        alertEl.classList.remove("d-none");
        return false;
      }
    }

    async function loadProducts() {
      try {
        products = await apiGet("/api/products");
        document.getElementById("productsTable").innerHTML = products.map(p => `
          <tr>
            <td><div class="d-flex align-items-center gap-2">
              <img src="${imgPath(p.image)}" class="productThumb" alt="">
              <strong>${p.name}</strong>
            </div></td>
            <td>₱${p.price.toLocaleString()}</td>
            <td>${stockLabel(p)}</td>
            <td><div class="d-flex flex-wrap gap-1">
              <button class="btn btn-success btn-sm" onclick="restockItem(${p.id})" title="Restock"><i class="fas fa-plus"></i></button>
              <button class="btn btn-warning btn-sm" onclick="setStockItem(${p.id})" title="Set stock"><i class="fas fa-edit"></i></button>
              <button class="btn btn-danger btn-sm" onclick="soldOutItem(${p.id})" title="Sold out"><i class="fas fa-ban"></i></button>
              <button class="btn btn-info btn-sm" onclick="preOrderItem(${p.id})" title="Pre-order"><i class="fas fa-clock"></i></button>
            </div></td>
          </tr>`).join("");
      } catch (e) {
        document.getElementById("productsTable").innerHTML =
          `<tr><td colspan="4" class="text-danger">${e.message}</td></tr>`;
      }
    }

    async function restockItem(id) {
      const amount = prompt("Enter stock quantity:", "10");
      if (amount === null) return;
      await apiPut(`/api/products/${id}/restock`, { stock: parseInt(amount, 10) });
      loadProducts();
    }

    async function setStockItem(id) {
      const amount = prompt("Set stock to:", "10");
      if (amount === null) return;
      await apiPut(`/api/products/${id}`, { stock: parseInt(amount, 10) });
      loadProducts();
    }

    async function soldOutItem(id) {
      if (confirm("Mark as sold out?")) await apiPut(`/api/products/${id}/sold-out`);
      loadProducts();
    }

    async function preOrderItem(id) {
      if (confirm("Mark as pre-order?")) await apiPut(`/api/products/${id}/pre-order`);
      loadProducts();
    }

    async function loadOrders() {
      const container = document.getElementById("ordersList");
      try {
        const orders = await apiGet("/api/orders");
        if (!orders.length) {
          container.innerHTML = '<p class="text-muted mb-0">No orders yet.</p>';
          return;
        }
        container.innerHTML = orders.map(o => `
          <div class="orderCard">
            <div class="d-flex justify-content-between flex-wrap gap-2 mb-2">
              <div>
                <strong>Order #${o.id}</strong> — ${o.buyer_name}
                <br><small class="text-muted">${o.buyer_email} · ${o.buyer_phone}</small>
              </div>
              <div class="text-end">
                <strong class="text-success">₱${o.total.toLocaleString()}</strong>
                <br><small class="text-muted">${new Date(o.created_at).toLocaleString()}</small>
              </div>
            </div>
            <div class="small mb-1"><i class="fas fa-map-marker-alt me-1"></i>${o.campus || ""} — ${o.address || ""}, ${o.city || ""}</div>
            <div class="small mb-2"><i class="fas fa-wallet me-1"></i>${o.payment_method || "N/A"}</div>
            <div>${o.items.map(i => `<span class="badge bg-primary me-1">${i.product_name} × ${i.quantity}</span>`).join("")}</div>
          </div>`).join("");
      } catch (e) {
        container.innerHTML = `<p class="text-danger mb-0">${e.message}</p>`;
      }
    }

    async function initAdmin() {
      if (await checkServer()) {
        await loadProducts();
        await loadOrders();
      }
    }

    initAdmin();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
