<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Officers Task - CampusPlan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
  <style>
    .taskItem {
      background: linear-gradient(135deg, rgba(26,87,120,0.9), rgba(0,123,255,0.85));
      color: #fff; padding: 18px; margin-bottom: 14px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.18); cursor: pointer; transition: transform 0.2s;
    }
    .taskItem:hover { transform: scale(1.01); }
    .taskItem.completed { background: linear-gradient(135deg, rgba(40,167,69,0.9), rgba(46,204,113,0.85)); }
    .taskItem.overdue { border-left: 4px solid #dc3545; }
    .checkboxGroup { background: rgba(255,255,255,0.08); padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    .checkboxItem { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,0.92); border-radius: 10px; margin-bottom: 8px; color: #222; cursor: pointer; }
    .tasksList { overflow: visible; }
    .fileAttachGroup { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .fileAttachBtn {
      background: linear-gradient(135deg, #1a5778, #007bff);
      color: #fff; padding: 8px 16px; border-radius: 20px;
      cursor: pointer; font-weight: 600; font-size: 0.9rem;
    }
    .fileAttachBtn:hover { opacity: 0.9; }
    #taskFile { display: none; }
    .pageSection .glassCard { color: #212529; }
    .pageSection h3 { color: #fff; }
  </style>
</head>
<body>
  <div id="navRoot" data-page="task" data-cart="true"></div>

  <section class="pageSection">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-6">
          <h3 class="mb-3"><i class="fas fa-plus-circle me-2"></i>Assign New Task</h3>
          <div class="glassCard">
            <form id="taskForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Officer Name</label>
                <input type="text" class="form-control formControlRound" id="taskName" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Department</label>
                <select class="form-select formControlRound" id="taskDepartment" required>
                  <option value="">Select Department</option>
                  <option>ITECH</option><option>COMSOC</option><option>AFBA</option>
                  <option>YSFPA</option><option>JPIIE</option><option>ECE</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Position</label>
                <input type="text" class="form-control formControlRound" id="taskPosition" required>
              </div>
              <div class="checkboxGroup">
                <h6 class="text-white mb-2">Type of Event</h6>
                <div class="checkboxItem"><input type="checkbox" id="evMeeting" value="Meeting"><label for="evMeeting">Meeting</label></div>
                <div class="checkboxItem"><input type="checkbox" id="evWorkshop" value="Seminar"><label for="evWorkshop">Seminar</label></div>
                <div class="checkboxItem"><input type="checkbox" id="evOrg" value="Event Organization"><label for="evOrg">Event Organization</label></div>
                <div class="checkboxItem"><input type="checkbox" id="evReport" value="Report"><label for="evReport">Report Preparation</label></div>
                <div class="checkboxItem"><input type="checkbox" id="evOther" value="Other"><label for="evOther">Other</label></div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea class="form-control formControlRound" id="taskDescription" rows="3" required></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Attach File</label>
                <div class="fileAttachGroup">
                  <input type="file" id="taskFile" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.txt">
                  <label for="taskFile" class="fileAttachBtn mb-0">
                    <i class="fas fa-paperclip me-1"></i>Choose File
                  </label>
                  <span id="taskFileName" class="small text-muted">No file chosen</span>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Deadline</label>
                <input type="datetime-local" class="form-control formControlRound" id="taskDeadline" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 formControlRound">Assign Task</button>
            </form>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="fas fa-list me-2"></i>Assigned Tasks</h3>
            <span class="badge bg-primary rounded-pill" id="taskCount">0</span>
          </div>
          <div class="tasksList" id="tasksList"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    let tasks = [];

    function setDefaultDeadline() {
      const d = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
      document.getElementById("taskDeadline").value = d.toISOString().slice(0, 16);
    }

    async function loadTasks() {
      try {
        tasks = await apiGet("/api/tasks");
        renderTasks();
      } catch (e) {
        document.getElementById("tasksList").innerHTML =
          `<p class="text-white">Could not load tasks. Start the Python server.</p>`;
      }
    }

    function renderTasks() {
      document.getElementById("taskCount").textContent = tasks.length;
      const list = document.getElementById("tasksList");
      if (!tasks.length) {
        list.innerHTML = `<div class="glassCard text-center py-5"><p class="mb-0 text-muted">No tasks assigned yet</p></div>`;
        return;
      }
      list.innerHTML = tasks.map(t => {
        const overdue = new Date(t.deadline) < new Date() && t.status !== "completed";
        const cls = ["taskItem", t.status === "completed" ? "completed" : "", overdue ? "overdue" : ""].filter(Boolean).join(" ");
        const types = (t.eventTypes || []).map(x => `<span class="badge bg-light text-dark me-1">${x}</span>`).join("");
        return `
          <div class="${cls}">
            <div class="d-flex justify-content-between">
              <div><strong>${t.officer_name}</strong><br><small>${t.department} · ${t.position}</small></div>
              <small>${new Date(t.deadline).toLocaleDateString()}</small>
            </div>
            <div class="mt-2">${types}</div>
            <p class="small mt-2 mb-2">${t.description}</p>
            <div class="d-flex gap-2 flex-wrap">
              ${t.status !== "completed" ? `<button class="btn btn-sm btn-warning" onclick="completeTask(${t.id})">Complete</button>` : `<button class="btn btn-sm btn-light" onclick="reopenTask(${t.id})">Reopen</button>`}
              <button class="btn btn-sm btn-success" onclick="submitTask(${t.id})">Submit</button>
              <button class="btn btn-sm btn-danger" onclick="removeTask(${t.id})">Delete</button>
            </div>
            ${t.attachment ? `<div class="mt-2 small"><i class="fas fa-paperclip me-1"></i>${t.attachment.fileName || "Attachment"}</div>` : ""}
            ${t.submission ? `<div class="mt-2 small bg-white bg-opacity-25 p-2 rounded"><strong>Submission:</strong> ${t.submission.description || ""}</div>` : ""}
          </div>`;
      }).join("");
    }

    document.getElementById("taskFile").addEventListener("change", function() {
      document.getElementById("taskFileName").textContent =
        this.files[0] ? this.files[0].name : "No file chosen";
    });

    function readTaskFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => resolve({
          fileName: file.name,
          fileUrl: ev.target.result,
          filePreview: file.type.startsWith("image/") ? ev.target.result : null
        });
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("taskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const eventTypes = Array.from(document.querySelectorAll("#taskForm input[type=checkbox]:checked")).map(cb => cb.value);
      if (!eventTypes.length) { alert("Select at least one event type"); return; }
      try {
        const payload = {
          officerName: document.getElementById("taskName").value.trim(),
          department: document.getElementById("taskDepartment").value,
          position: document.getElementById("taskPosition").value.trim(),
          eventTypes,
          description: document.getElementById("taskDescription").value.trim(),
          deadline: document.getElementById("taskDeadline").value
        };
        const fileInput = document.getElementById("taskFile");
        if (fileInput.files[0]) {
          if (fileInput.files[0].size > 10 * 1024 * 1024) {
            alert("File too large. Maximum 10MB.");
            return;
          }
          payload.attachment = await readTaskFile(fileInput.files[0]);
        }
        await apiPost("/api/tasks", payload);
        taskForm.reset();
        document.getElementById("taskFileName").textContent = "No file chosen";
        setDefaultDeadline();
        showToast("Task assigned");
        await loadTasks();
      } catch (err) { alert(err.message); }
    });

    async function completeTask(id) {
      await apiPut(`/api/tasks/${id}`, { status: "completed", completedAt: new Date().toISOString() });
      showToast("Task completed");
      await loadTasks();
    }

    async function reopenTask(id) {
      await apiPut(`/api/tasks/${id}`, { status: "pending", completedAt: null });
      await loadTasks();
    }

    async function submitTask(id) {
      const description = prompt("Enter submission description:");
      if (!description || !description.trim()) return;
      await apiPut(`/api/tasks/${id}`, {
        submission: { description: description.trim(), submittedAt: new Date().toISOString() }
      });
      showToast("Submission saved");
      await loadTasks();
    }

    async function removeTask(id) {
      if (!confirm("Delete this task?")) return;
      await apiDelete(`/api/tasks/${id}`);
      showToast("Task deleted");
      await loadTasks();
    }

    applyPageBackground("PUPSTC.jpg");
    setDefaultDeadline();
    loadTasks();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
