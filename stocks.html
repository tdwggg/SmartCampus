<!DOCTYPE html>
<html>
<head>
<title>Stock Control</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

<h2>Stock Control Panel</h2>

<table class="table table-bordered">
<thead>
<tr>
<th>Product</th>
<th>Stock</th>
<th>Set</th>
<th>Status</th>
</tr>
</thead>
<tbody id="stockTable"></tbody>
</table>

<script>
const API_URL = 'http://localhost:5000/api';
let products = [];

async function render(){
  let html="";
  
  products.forEach((p)=>{
    html += `
    <tr>
      <td>${p.name}</td>
      <td>${p.stock === 999 ? 'Pre-Order' : p.stock}</td>
      <td>
        <input type="number" id="stock${p.id}" class="form-control" placeholder="Enter stock">
      </td>
      <td>
        <button class="btn btn-success btn-sm" onclick="updateStock(${p.id})">Update</button>
        <button class="btn btn-danger btn-sm" onclick="setZero(${p.id})">Sold Out</button>
        <button class="btn btn-warning btn-sm" onclick="setPreOrder(${p.id})">Pre-Order</button>
      </td>
    </tr>
    `;
  });
  
  document.getElementById("stockTable").innerHTML = html;
}

async function loadProducts(){
  try {
    const response = await fetch(`${API_URL}/products`);
    products = await response.json();
    await render();
  } catch (error) {
    console.error('Error loading products:', error);
    alert('Failed to connect to database. Make sure Flask app is running on port 5000');
  }
}

async function updateStock(id){
  let val = document.getElementById("stock"+id).value;
  try {
    const response = await fetch(`${API_URL}/products/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stock: parseInt(val) })
    });
    await loadProducts();
  } catch (error) {
    console.error('Error updating stock:', error);
  }
}

async function setZero(id){
  try {
    const response = await fetch(`${API_URL}/products/${id}/sold-out`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' }
    });
    await loadProducts();
  } catch (error) {
    console.error('Error marking sold out:', error);
  }
}

async function setPreOrder(id){
  try {
    const response = await fetch(`${API_URL}/products/${id}/pre-order`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' }
    });
    await loadProducts();
  } catch (error) {
    console.error('Error marking pre-order:', error);
  }
}

loadProducts();
</script>

</body>
</html>
